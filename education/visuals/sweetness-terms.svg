<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-label="Sweetness terms and German Pradikat">
  <rect width="1100" height="820" fill="#fdf8ee"/>
  <rect x="0" y="0" width="1100" height="96" fill="#5b2a6e"/>
  <text x="40" y="42" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Sweetness Terms — and German Prädikat</text>
  <text x="40" y="74" font-family="sans-serif" font-size="17" fill="#eadcf2">Two different systems. Do not use one to define the other.</text>

  <g font-family="sans-serif">
    <text x="40" y="135" font-size="20" font-weight="bold" fill="#222222">1 · How sweet does the wine TASTE? (still wine, WSET scale)</text>
    <!-- scale -->
    <rect x="40" y="150" width="250" height="90" fill="#e8f0d8"/><text x="165" y="185" font-size="20" font-weight="bold" text-anchor="middle" fill="#222222">DRY</text><text x="165" y="212" font-size="14" text-anchor="middle" fill="#333333">No perceptible sweetness</text>
    <rect x="295" y="150" width="250" height="90" fill="#fff3cd"/><text x="420" y="185" font-size="20" font-weight="bold" text-anchor="middle" fill="#222222">OFF-DRY</text><text x="420" y="212" font-size="14" text-anchor="middle" fill="#333333">A touch of sweetness</text>
    <rect x="550" y="150" width="250" height="90" fill="#ffe0b3"/><text x="675" y="185" font-size="20" font-weight="bold" text-anchor="middle" fill="#222222">MEDIUM</text><text x="675" y="212" font-size="14" text-anchor="middle" fill="#333333">Clearly sweet, balanced</text>
    <rect x="805" y="150" width="265" height="90" fill="#f5c6c6"/><text x="937" y="185" font-size="20" font-weight="bold" text-anchor="middle" fill="#222222">SWEET</text><text x="937" y="212" font-size="14" text-anchor="middle" fill="#333333">Sweetness dominates</text>
    <text x="40" y="270" font-size="15" fill="#333333">Sweetness is judged by taste, not by a single sugar number — acidity, alcohol and tannin all change how sweet a wine seems.</text>

    <text x="40" y="315" font-size="20" font-weight="bold" fill="#222222">2 · German Prädikat — a RIPENESS ladder, in increasing grape ripeness</text>
    <g font-size="15" fill="#222222">
      <rect x="40" y="330" width="1030" height="52" fill="#ffffff"/><text x="60" y="362" font-size="17" font-weight="bold">Kabinett</text><text x="280" y="362">Lightest, least ripe; often delicate and fresh</text>
      <rect x="40" y="382" width="1030" height="52" fill="#f2f6f8"/><text x="60" y="414" font-size="17" font-weight="bold">Spätlese</text><text x="280" y="414">Later-picked; riper, fuller</text>
      <rect x="40" y="434" width="1030" height="52" fill="#ffffff"/><text x="60" y="466" font-size="17" font-weight="bold">Auslese</text><text x="280" y="466">Selected ripe bunches; richer still</text>
      <rect x="40" y="486" width="1030" height="52" fill="#f2f6f8"/><text x="60" y="518" font-size="17" font-weight="bold">Beerenauslese</text><text x="280" y="518">Selected ripe berries, often noble rot; sweet</text>
      <rect x="40" y="538" width="1030" height="52" fill="#ffffff"/><text x="60" y="570" font-size="17" font-weight="bold">Trockenbeerenauslese</text><text x="280" y="570">Selected dried berries, noble rot; very sweet, rare</text>
      <rect x="40" y="590" width="1030" height="52" fill="#f2f6f8"/><text x="60" y="622" font-size="17" font-weight="bold">Eiswein</text><text x="280" y="622">Grapes frozen on the vine, pressed frozen; sweet, high acidity</text>
    </g>

    <text x="40" y="680" font-size="20" font-weight="bold" fill="#222222">3 · Trocken / Halbtrocken — German label words for DRYNESS</text>
    <text x="40" y="708" font-size="16" fill="#222222"><tspan font-weight="bold">Trocken</tspan> = dry &#160;&#160;·&#160;&#160; <tspan font-weight="bold">Halbtrocken</tspan> = off-dry / half-dry</text>
  </g>
  <rect x="40" y="730" width="1030" height="55" rx="10" fill="#fff3cd"/>
  <text x="60" y="763" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">⚠ WARNING: Prädikat is ripeness at harvest, NOT sweetness alone.</text>
  <text x="40" y="803" font-family="sans-serif" font-size="13" fill="#666666">Supports: Ch. 8 (Germany) · knowledge/sweetness-sparkling-fortified-terms.md — A Kabinett can be trocken (dry) if fermented to dryness.</text>
</svg>
