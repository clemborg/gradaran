<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-label="Sparkling wine methods">
  <rect width="1100" height="780" fill="#fdf8ee"/>
  <rect x="0" y="0" width="1100" height="96" fill="#1f4a6b"/>
  <text x="40" y="42" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Sparkling Wine: How the Bubbles Get In</text>
  <text x="40" y="74" font-family="sans-serif" font-size="17" fill="#d8e8f5">All sparkling wine needs a second source of CO₂. The method decides cost, texture and flavour.</text>

  <g font-family="sans-serif">
    <rect x="40" y="125" width="505" height="250" rx="12" fill="#ffffff" stroke="#1f4a6b" stroke-width="2"/>
    <text x="65" y="165" font-size="20" font-weight="bold" fill="#1f4a6b">TRADITIONAL METHOD</text>
    <text x="65" y="190" font-size="15" font-weight="bold" fill="#555555">Bottle — second fermentation in bottle</text>
    <text x="65" y="220" font-size="15" fill="#222222">Base wine + yeast + sugar bottled;</text>
    <text x="65" y="243" font-size="15" fill="#222222">second fermentation makes CO₂</text>
    <text x="65" y="266" font-size="15" fill="#222222">trapped in the bottle.</text>
    <text x="65" y="296" font-size="15" fill="#222222">Aged on lees (dead yeast) —</text>
    <text x="65" y="319" font-size="15" fill="#222222">gives biscuit / brioche / bread</text>
    <text x="65" y="342" font-size="15" fill="#222222">notes and fine, persistent mousse.</text>
    <text x="65" y="365" font-size="15" fill="#7a3b1e">Champagne, Cava, Crémant, Franciacorta</text>

    <rect x="565" y="125" width="505" height="250" rx="12" fill="#ffffff" stroke="#2e6b3a" stroke-width="2"/>
    <text x="590" y="165" font-size="20" font-weight="bold" fill="#2e6b3a">TANK METHOD</text>
    <text x="590" y="190" font-size="15" font-weight="bold" fill="#555555">Tank — second fermentation in tank</text>
    <text x="590" y="220" font-size="15" fill="#222222">Second fermentation in a sealed,</text>
    <text x="590" y="243" font-size="15" fill="#222222">pressurised tank, then bottled</text>
    <text x="590" y="266" font-size="15" fill="#222222">under pressure.</text>
    <text x="590" y="296" font-size="15" fill="#222222">Cheaper and faster; keeps fresh,</text>
    <text x="590" y="319" font-size="15" fill="#222222">fruity, aromatic character —</text>
    <text x="590" y="342" font-size="15" fill="#222222">little or no lees character.</text>
    <text x="590" y="365" font-size="15" fill="#7a3b1e">Prosecco (most), many aromatic sparklers</text>

    <rect x="40" y="400" width="505" height="250" rx="12" fill="#ffffff" stroke="#7a3b1e" stroke-width="2"/>
    <text x="65" y="440" font-size="20" font-weight="bold" fill="#7a3b1e">TRANSFER METHOD</text>
    <text x="65" y="465" font-size="15" font-weight="bold" fill="#555555">Bottle, then transfer to tank</text>
    <text x="65" y="495" font-size="15" fill="#222222">Second fermentation in bottle,</text>
    <text x="65" y="518" font-size="15" fill="#222222">as in the traditional method,</text>
    <text x="65" y="541" font-size="15" fill="#222222">then the wine is transferred</text>
    <text x="65" y="564" font-size="15" fill="#222222">to a tank, filtered, and</text>
    <text x="65" y="587" font-size="15" fill="#222222">re-bottled under pressure.</text>
    <text x="65" y="617" font-size="15" fill="#222222">Keeps some lees character;</text>
    <text x="65" y="640" font-size="15" fill="#222222">avoids riddling / disgorging</text>
    <text x="65" y="640" font-size="15" fill="#222222"></text>

    <rect x="565" y="400" width="505" height="250" rx="12" fill="#ffffff" stroke="#b8860b" stroke-width="2"/>
    <text x="590" y="440" font-size="20" font-weight="bold" fill="#7a5a00">CARBONATION</text>
    <text x="590" y="465" font-size="15" font-weight="bold" fill="#555555">CO₂ added — no second fermentation</text>
    <text x="590" y="495" font-size="15" fill="#222222">CO₂ is injected into still wine,</text>
    <text x="590" y="518" font-size="15" fill="#222222">like a soft drink.</text>
    <text x="590" y="548" font-size="15" fill="#222222">Cheapest method. Bubbles are</text>
    <text x="590" y="571" font-size="15" fill="#222222">usually larger and fade faster;</text>
    <text x="590" y="594" font-size="15" fill="#222222">no fermentation or lees</text>
    <text x="590" y="617" font-size="15" fill="#222222">character at all.</text>
    <text x="590" y="640" font-size="15" fill="#7a3b1e">Low-cost sparkling wines</text>
  </g>
  <rect x="40" y="675" width="1030" height="60" rx="10" fill="#eef3e2"/>
  <text x="60" y="711" font-family="sans-serif" font-size="16" fill="#222222">Exam cue: lees ageing time → autolytic (biscuit / bread) character. No lees time → fresh fruit only.</text>
  <text x="40" y="762" font-family="sans-serif" font-size="13" fill="#666666">Supports: Ch. 15 (sparkling) · knowledge/sweetness-sparkling-fortified-terms.md</text>
</svg>
