<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-label="Grape composition during ripening">
  <rect width="1100" height="780" fill="#fdf8ee"/>
  <rect x="0" y="0" width="1100" height="96" fill="#5b2a6e"/>
  <text x="40" y="42" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">What Changes as Grapes Ripen</text>
  <text x="40" y="74" font-family="sans-serif" font-size="17" fill="#eadcf2">From véraison to harvest — the four changes that decide the wine.</text>

  <g font-family="sans-serif">
    <!-- Panel 1 -->
    <rect x="40" y="125" width="505" height="235" rx="12" fill="#ffffff" stroke="#5b2a6e" stroke-width="2"/>
    <text x="65" y="165" font-size="20" font-weight="bold" fill="#5b2a6e">SUGAR  ↑  RISES</text>
    <text x="65" y="195" font-size="15" fill="#222222">Sugar accumulates steadily through ripening.</text>
    <text x="65" y="225" font-size="16" font-weight="bold" fill="#222222">What it means:</text>
    <text x="65" y="250" font-size="15" fill="#222222">More sugar → more alcohol after fermentation.</text>
    <text x="65" y="275" font-size="15" fill="#222222">If fermentation stops early, leftover sugar</text>
    <text x="65" y="300" font-size="15" fill="#222222">remains as sweetness in the wine.</text>
    <text x="65" y="330" font-size="15" fill="#7a3b1e">Warm climate / late pick = higher alcohol.</text>

    <!-- Panel 2 -->
    <rect x="565" y="125" width="505" height="235" rx="12" fill="#ffffff" stroke="#2e6b3a" stroke-width="2"/>
    <text x="590" y="165" font-size="20" font-weight="bold" fill="#2e6b3a">MALIC ACID  ↓  FALLS SHARPLY</text>
    <text x="590" y="195" font-size="15" fill="#222222">Malic acid is respired away as grapes ripen,</text>
    <text x="590" y="220" font-size="15" fill="#222222">especially in warm weather.</text>
    <text x="590" y="250" font-size="16" font-weight="bold" fill="#222222">What it means:</text>
    <text x="590" y="275" font-size="15" fill="#222222">Freshness / crisp acidity drops as ripening</text>
    <text x="590" y="300" font-size="15" fill="#222222">advances. Cool climates keep more malic</text>
    <text x="590" y="325" font-size="15" fill="#222222">acid — and more freshness.</text>

    <!-- Panel 3 -->
    <rect x="40" y="385" width="505" height="235" rx="12" fill="#ffffff" stroke="#1f4a6b" stroke-width="2"/>
    <text x="65" y="425" font-size="20" font-weight="bold" fill="#1f4a6b">TARTARIC ACID  →  STEADIER</text>
    <text x="65" y="455" font-size="15" fill="#222222">Tartaric acid is more stable than malic acid</text>
    <text x="65" y="480" font-size="15" fill="#222222">during ripening; it falls much less.</text>
    <text x="65" y="510" font-size="16" font-weight="bold" fill="#222222">What it means:</text>
    <text x="65" y="535" font-size="15" fill="#222222">Tartaric acid is the backbone of acidity</text>
    <text x="65" y="560" font-size="15" fill="#222222">that remains even in ripe, warm-climate</text>
    <text x="65" y="585" font-size="15" fill="#222222">grapes. Total acidity still falls overall,</text>
    <text x="65" y="610" font-size="15" fill="#222222">mainly because malic acid is lost.</text>

    <!-- Panel 4 -->
    <rect x="565" y="385" width="505" height="235" rx="12" fill="#ffffff" stroke="#7a3b1e" stroke-width="2"/>
    <text x="590" y="425" font-size="20" font-weight="bold" fill="#7a3b1e">COLOUR · TANNIN · FLAVOUR  ↑</text>
    <text x="590" y="455" font-size="15" fill="#222222">Colour and tannin develop in skins and</text>
    <text x="590" y="480" font-size="15" fill="#222222">seeds; flavours move from green / herbal</text>
    <text x="590" y="505" font-size="15" fill="#222222">toward ripe fruit.</text>
    <text x="590" y="535" font-size="16" font-weight="bold" fill="#222222">What it means:</text>
    <text x="590" y="560" font-size="15" fill="#222222">Structure and flavour intensity grow —</text>
    <text x="590" y="585" font-size="15" fill="#222222">but under-ripe tannins taste green and</text>
    <text x="590" y="610" font-size="15" fill="#222222">harsh; over-ripe fruit can lose freshness.</text>
  </g>
  <rect x="40" y="645" width="1030" height="90" rx="10" fill="#eef3e2"/>
  <text x="60" y="675" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">The winemaker’s trade-off: ripeness vs freshness.</text>
  <text x="60" y="700" font-family="sans-serif" font-size="15" fill="#333333">Pick early = lower alcohol, higher acidity, greener flavours. Pick late = higher alcohol, softer acidity, riper flavours.</text>
  <text x="60" y="722" font-family="sans-serif" font-size="15" fill="#333333">Lactic acid is NOT a grape acid — it comes from malolactic fermentation (see winemaking).</text>
  <text x="40" y="762" font-family="sans-serif" font-size="13" fill="#666666">Supports: Ch. 1–3 · knowledge/grape-composition-ripening.md</text>
</svg>
