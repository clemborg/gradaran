<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-label="Schematic map of Burgundy north to south">
  <rect width="1100" height="800" fill="#fdf8ee"/>
  <rect x="0" y="0" width="1100" height="96" fill="#5b2a6e"/>
  <text x="40" y="42" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Burgundy — North to South</text>
  <text x="40" y="74" font-family="sans-serif" font-size="17" fill="#eadcf2">Schematic map — not to scale, relative positions only</text>
  <g font-family="sans-serif">
    <text x="550" y="135" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">N ↑ &#160; — &#160; read top to bottom</text>
    <!-- Vertical strip -->
    <rect x="380" y="150" width="340" height="520" rx="12" fill="#e8eef2" stroke="#5b2a6e" stroke-width="3"/>
    <g font-size="20" font-weight="bold" fill="#222222" text-anchor="middle">
      <rect x="400" y="170" width="300" height="62" rx="8" fill="#ffffff" stroke="#5b2a6e" stroke-width="2"/><text x="550" y="208">Chablis</text>
      <text x="550" y="255" font-size="14" font-weight="normal" fill="#555555">north — separate, Chardonnay</text>
      <rect x="400" y="270" width="300" height="62" rx="8" fill="#ffffff" stroke="#5b2a6e" stroke-width="2"/><text x="550" y="308">Côte de Nuits</text>
      <text x="550" y="355" font-size="14" font-weight="normal" fill="#555555">Pinot Noir heartland</text>
      <rect x="400" y="370" width="300" height="62" rx="8" fill="#ffffff" stroke="#5b2a6e" stroke-width="2"/><text x="550" y="408">Côte de Beaune</text>
      <text x="550" y="455" font-size="14" font-weight="normal" fill="#555555">Pinot Noir + great Chardonnay</text>
      <rect x="400" y="470" width="300" height="62" rx="8" fill="#ffffff" stroke="#5b2a6e" stroke-width="2"/><text x="550" y="508">Côte Chalonnaise</text>
      <rect x="400" y="552" width="300" height="62" rx="8" fill="#ffffff" stroke="#5b2a6e" stroke-width="2"/><text x="550" y="590">Mâconnais</text>
      <rect x="400" y="614" width="180" height="40" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/><text x="490" y="641" font-size="16">↓ Beaujolais</text>
    </g>
    <text x="760" y="300" font-size="16" fill="#333333">Côte de Nuits +</text>
    <text x="760" y="325" font-size="16" fill="#333333">Côte de Beaune</text>
    <text x="760" y="350" font-size="16" font-weight="bold" fill="#5b2a6e">= the Côte d’Or</text>
    <text x="760" y="380" font-size="15" fill="#555555">(“golden slope”)</text>
    <text x="760" y="430" font-size="16" fill="#333333">Beaujolais lies</text>
    <text x="760" y="455" font-size="16" fill="#333333">south of the</text>
    <text x="760" y="480" font-size="16" fill="#333333">Mâconnais —</text>
    <text x="760" y="505" font-size="16" fill="#333333">Gamay country.</text>
  </g>
  <text x="40" y="720" font-family="sans-serif" font-size="15" fill="#333333">Note: Chablis is geographically separate, well north of the Côte d’Or — do not place it next to Beaune.</text>
  <text x="40" y="745" font-family="sans-serif" font-size="15" fill="#333333">Burgundy is CONTINENTAL in climate — inland, with large seasonal swings and vintage variation.</text>
  <text x="40" y="785" font-family="sans-serif" font-size="13" fill="#666666">Schematic map — not to scale, relative positions only · Supports: Ch. 4 (Burgundy, Chablis, Beaujolais)</text>
</svg>
