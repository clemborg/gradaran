<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-label="Schematic map of Bordeaux">
  <rect width="1100" height="800" fill="#fdf8ee"/>
  <rect x="0" y="0" width="1100" height="96" fill="#1f4a6b"/>
  <text x="40" y="42" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">Bordeaux — Around the Gironde</text>
  <text x="40" y="74" font-family="sans-serif" font-size="17" fill="#d8e8f5">Schematic map — not to scale, relative positions only</text>
  <g font-family="sans-serif">
    <text x="550" y="135" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">N ↑</text>
    <!-- Estuary -->
    <path d="M 520 160 L 600 160 L 580 620 L 500 620 Z" fill="#a8c8e0" stroke="#1f4a6b" stroke-width="3"/>
    <text x="550" y="300" font-size="17" font-weight="bold" fill="#1f4a6b" text-anchor="middle" transform="rotate(90 550 300)">GIRONDE ESTUARY</text>
    <text x="550" y="650" font-size="15" fill="#555555" text-anchor="middle">flows north-west to the Atlantic</text>
    <!-- Left Bank -->
    <rect x="180" y="180" width="280" height="90" rx="10" fill="#ffffff" stroke="#1f4a6b" stroke-width="2"/>
    <text x="320" y="218" font-size="20" font-weight="bold" fill="#1f4a6b" text-anchor="middle">LEFT BANK</text>
    <text x="320" y="245" font-size="15" fill="#333333" text-anchor="middle">west of the Gironde / Garonne</text>
    <rect x="180" y="290" width="280" height="70" rx="8" fill="#e8eef2" stroke="#1f4a6b" stroke-width="2"/>
    <text x="320" y="318" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Médoc — north</text>
    <text x="320" y="342" font-size="14" fill="#555555" text-anchor="middle">Cabernet Sauvignon-led</text>
    <rect x="180" y="380" width="280" height="70" rx="8" fill="#e8eef2" stroke="#1f4a6b" stroke-width="2"/>
    <text x="320" y="408" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Graves — south</text>
    <text x="320" y="432" font-size="14" fill="#555555" text-anchor="middle">red + dry white</text>
    <rect x="180" y="470" width="280" height="70" rx="8" fill="#fff3cd" stroke="#b8860b" stroke-width="2"/>
    <text x="320" y="498" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Sauternes — south</text>
    <text x="320" y="522" font-size="14" fill="#555555" text-anchor="middle">sweet, noble rot — south of Graves</text>
    <!-- Right Bank -->
    <rect x="640" y="180" width="280" height="90" rx="10" fill="#ffffff" stroke="#7a3b1e" stroke-width="2"/>
    <text x="780" y="218" font-size="20" font-weight="bold" fill="#7a3b1e" text-anchor="middle">RIGHT BANK</text>
    <text x="780" y="245" font-size="15" fill="#333333" text-anchor="middle">east of the Gironde / Dordogne</text>
    <rect x="640" y="290" width="280" height="70" rx="8" fill="#f5e8e0" stroke="#7a3b1e" stroke-width="2"/>
    <text x="780" y="318" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Saint-Émilion</text>
    <text x="780" y="342" font-size="14" fill="#555555" text-anchor="middle">Merlot-led</text>
    <rect x="640" y="380" width="280" height="70" rx="8" fill="#f5e8e0" stroke="#7a3b1e" stroke-width="2"/>
    <text x="780" y="408" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Pomerol</text>
    <text x="780" y="432" font-size="14" fill="#555555" text-anchor="middle">Merlot-led</text>
    <!-- Entre-Deux-Mers -->
    <rect x="620" y="470" width="320" height="70" rx="8" fill="#eef3e2" stroke="#2e6b3a" stroke-width="2"/>
    <text x="780" y="498" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Entre-Deux-Mers</text>
    <text x="780" y="522" font-size="14" fill="#555555" text-anchor="middle">between the Garonne &amp; Dordogne</text>
    <text x="320" y="580" font-size="15" fill="#333333" text-anchor="middle">Garonne river</text>
    <text x="780" y="580" font-size="15" fill="#333333" text-anchor="middle">Dordogne river</text>
  </g>
  <text x="40" y="700" font-family="sans-serif" font-size="15" fill="#333333">Left Bank / Right Bank are named by the river as it flows toward the sea — Left Bank is west, Right Bank is east.</text>
  <text x="40" y="725" font-family="sans-serif" font-size="15" fill="#333333">Bordeaux is MARITIME in climate — Atlantic influence, moderate temperatures, rain through the season.</text>
  <text x="40" y="785" font-family="sans-serif" font-size="13" fill="#666666">Schematic map — not to scale, relative positions only · Supports: Ch. 5 (Bordeaux)</text>
</svg>
